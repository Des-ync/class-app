# Static privacy, support and data-deletion pages for the store listings.
[build]
  publish = "site"
  command = ""
  # Skip builds when a push leaves the site untouched (exit 0 skips). The first
  # build, and any comparison git cannot make, still deploys.
  ignore = 'test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- site/ netlify.toml'

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; style-src 'self'; img-src 'self'; script-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
